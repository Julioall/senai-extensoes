<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENAI Extensões</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="sx-popup sx-reset">
    <section class="sx-popup__shell sx-panel">
      <header class="sx-popup__header">
        <span class="sx-brand-mark" aria-hidden="true">S</span>
        <div class="sx-popup__heading">
          <h1>SENAI Extensões</h1>
          <p>Ferramentas para Moodle, Drive e Kahoot</p>
        </div>
        <button class="sx-icon-button" id="close-button" type="button" aria-label="Fechar">
          <svg class="sx-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="sx-popup__content">
        <section class="sx-settings-card" aria-labelledby="modules-title">
          <h2 class="sx-section-title" id="modules-title">Recursos ativos</h2>
          <div class="sx-settings-list">
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--moodle" aria-hidden="true">
                <svg class="sx-icon" viewBox="0 0 24 24"><path d="m3 8 9-4 9 4-9 4-9-4Z"/><path d="M7 10.2V15c2.6 2 7.4 2 10 0v-4.8M21 8v6"/></svg>
              </span>
              <span class="sx-setting-copy"><strong>Moodle</strong></span>
              <input type="checkbox" data-setting="modules.moodle" aria-label="Ativar Moodle">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--green" aria-hidden="true">
                <svg class="sx-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16h14V6Z"/><path d="M14 2v4h4M9 13h6M12 10v6m-3-3 3 3 3-3"/></svg>
              </span>
              <span class="sx-setting-copy"><strong>Baixar PDF</strong></span>
              <input type="checkbox" data-setting="modules.drivePdf" aria-label="Ativar Baixar PDF">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--kahoot" aria-hidden="true">K!</span>
              <span class="sx-setting-copy"><strong>Kahoot</strong></span>
              <input type="checkbox" data-setting="modules.kahoot" aria-label="Ativar Kahoot">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
          </div>
        </section>

        <section class="sx-settings-card" aria-labelledby="moodle-title">
          <h2 class="sx-section-title" id="moodle-title">Moodle</h2>
          <div class="sx-settings-list">
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--blue" aria-hidden="true">
                <svg class="sx-icon" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 14v5h14v-5"/></svg>
              </span>
              <span class="sx-setting-copy"><strong>Importação de notas</strong></span>
              <input type="checkbox" data-setting="moodle.importer">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--blue" aria-hidden="true">
                <svg class="sx-icon" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
              </span>
              <span class="sx-setting-copy"><strong>Relatório de notas</strong></span>
              <input type="checkbox" data-setting="moodle.gradeReports">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--orange" aria-hidden="true">
                <svg class="sx-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>
              </span>
              <span class="sx-setting-copy"><strong>Pendências de correção</strong></span>
              <input type="checkbox" data-setting="moodle.coursePendingChecks">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
            <label class="sx-setting-row">
              <span class="sx-setting-icon sx-setting-icon--green" aria-hidden="true">
                <svg class="sx-icon" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M5 19h14"/></svg>
              </span>
              <span class="sx-setting-copy"><strong>Baixar pendentes</strong></span>
              <input type="checkbox" data-setting="moodle.pendingDownloads">
              <span class="sx-switch" aria-hidden="true"></span>
            </label>
          </div>
        </section>
      </div>

      <p class="sx-popup__status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="../shared/runtime.js"></script>
  <script src="popup.js"></script>
</body>
</html>
